<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700');
      .terminal-bg { fill: #0d1117; }
      .title-bar { fill: #161b22; }
      .dot-red { fill: #ff5f57; }
      .dot-yellow { fill: #febc2e; }
      .dot-green { fill: #28c840; }
      .prompt { fill: #7ee787; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; font-weight: 500; }
      .cmd { fill: #79c0ff; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; font-weight: 500; }
      .response { fill: #e6edf3; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .border-rect { fill: none; stroke: #30363d; stroke-width: 1; }
    </style>
  </defs>
  <!-- Background -->
  <rect class="terminal-bg" x="0" y="0" width="440" height="200" rx="10" ry="10"/>
  <!-- Title bar -->
  <rect class="title-bar" x="0" y="0" width="440" height="36" rx="10" ry="10"/>
  <rect class="title-bar" x="0" y="20" width="440" height="16"/>
  <!-- Traffic light dots -->
  <circle class="dot-red" cx="20" cy="18" r="6"/>
  <circle class="dot-yellow" cx="40" cy="18" r="6"/>
  <circle class="dot-green" cx="60" cy="18" r="6"/>
  <!-- Title text -->
  <text x="170" y="23" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ammar@fast: ~</text>
  <!-- Prompt line -->
  <text class="prompt" x="16" y="60">ammar@fast</text>
  <text fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="13" x="100" y="60">:</text>
  <text fill="#79c0ff" font-family="'JetBrains Mono', monospace" font-size="13" x="108" y="60">~</text>
  <text fill="#e6edf3" font-family="'JetBrains Mono', monospace" font-size="13" x="120" y="60">$</text>
  <text class="cmd" x="136" y="60">cat motivation.txt</text>
  <!-- Response lines -->
  <text class="response" x="16" y="88">Building today</text>
  <text class="response" x="16" y="110">what didn't exist</text>
  <text class="response" x="16" y="132">yesterday.</text>
  <!-- Second prompt with blinking cursor -->
  <text class="prompt" x="16" y="164">ammar@fast</text>
  <text fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="13" x="100" y="164">:</text>
  <text fill="#79c0ff" font-family="'JetBrains Mono', monospace" font-size="13" x="108" y="164">~</text>
  <text fill="#e6edf3" font-family="'JetBrains Mono', monospace" font-size="13" x="120" y="164">$</text>
  <!-- Blinking cursor -->
  <rect fill="#7ee787" x="136" y="154" width="8" height="16" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Border -->
  <rect class="border-rect" x="0.5" y="0.5" width="439" height="199" rx="10" ry="10"/>
</svg>