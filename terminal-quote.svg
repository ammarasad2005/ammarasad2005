<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210">
  <defs>
    <style>
      .terminal-bg { fill: #0d1117; }
      .title-bar { fill: #161b22; }
      .prompt { fill: #7ee787; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13.5px; font-weight: 600; }
      .cmd { fill: #79c0ff; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13.5px; font-weight: 500; }
      .response { fill: #e6edf3; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13.5px; }
      .separator { fill: #8b949e; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; }
      .tilde { fill: #79c0ff; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; }
      .dollar { fill: #e6edf3; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; }
    </style>
  </defs>
  <!-- Background -->
  <rect class="terminal-bg" x="0" y="0" width="480" height="210" rx="10" ry="10"/>
  <!-- Title bar -->
  <rect class="title-bar" x="0" y="0" width="480" height="38" rx="10" ry="10"/>
  <rect class="title-bar" x="0" y="22" width="480" height="16"/>
  <!-- Traffic light dots -->
  <circle fill="#ff5f57" cx="22" cy="19" r="6.5"/>
  <circle fill="#febc2e" cx="42" cy="19" r="6.5"/>
  <circle fill="#28c840" cx="62" cy="19" r="6.5"/>
  <!-- Title text -->
  <text x="195" y="24" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="12.5" text-anchor="middle">ammar@fast: ~</text>
  <!-- Prompt line -->
  <text class="prompt" x="18" y="64">ammar@fast</text>
  <text class="separator" x="105" y="64">:</text>
  <text class="tilde" x="113" y="64">~</text>
  <text class="dollar" x="125" y="64">$</text>
  <text class="cmd" x="141" y="64">cat motivation.txt</text>
  <!-- Response lines -->
  <text class="response" x="18" y="94">Building today</text>
  <text class="response" x="18" y="118">what didn't exist</text>
  <text class="response" x="18" y="142">yesterday.</text>
  <!-- Second prompt with blinking cursor -->
  <text class="prompt" x="18" y="176">ammar@fast</text>
  <text class="separator" x="105" y="176">:</text>
  <text class="tilde" x="113" y="176">~</text>
  <text class="dollar" x="125" y="176">$</text>
  <!-- Blinking cursor -->
  <rect fill="#7ee787" x="141" y="165" width="9" height="17" rx="1.5">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Border -->
  <rect fill="none" stroke="#30363d" stroke-width="1" x="0.5" y="0.5" width="479" height="209" rx="10" ry="10"/>
</svg>