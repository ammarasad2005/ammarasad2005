<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="800" height="12">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="15%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="1"/>
      <stop offset="65%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#8B6914" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="6" x2="800" y2="6" stroke="url(#divGrad)" stroke-width="1.2" stroke-dasharray="800" stroke-dashoffset="800" opacity="0">
    <animate attributeName="stroke-dashoffset" from="800" to="0" dur="0.8s" begin="0.1s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.1s" fill="freeze"/>
  </line>
  <!-- Center diamond accent -->
  <rect x="395" y="2" width="6" height="6" rx="1" fill="#2563EB" opacity="0" transform="rotate(45,398,5)">
    <animate attributeName="opacity" from="0" to="0.6" dur="0.3s" begin="0.7s" fill="freeze"/>
  </rect>
</svg>
