<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800">
  <defs>
    <linearGradient id="cardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Section Title -->
  <text x="400" y="30" text-anchor="middle" fill="#ECFDF5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" opacity="0">
    What I Build
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
  </text>
  <line x1="340" y1="42" x2="460" y2="42" stroke="#30363d" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.3s" begin="0.3s" fill="freeze"/>
  </line>

  <!-- Row 1 -->

  <!-- Card 1: Campus Platforms -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 15" to="0 0" dur="0.5s" begin="0.4s" fill="freeze"/>
    <rect x="15" y="55" width="375" height="120" rx="10" fill="#0d1117"/>
    <rect x="15" y="55" width="375" height="120" rx="10" fill="url(#cardShine)"/>
    <rect x="15" y="55" width="375" height="120" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
    <!-- Left accent bar -->
    <rect x="15" y="55" width="4" height="120" rx="2" fill="#10B981"/>
    <!-- Icon -->
    <circle cx="48" cy="88" r="14" fill="#064E3B" opacity="0.5"/>
    <circle cx="48" cy="88" r="14" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.6"/>
    <circle cx="48" cy="88" r="6" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.8"/>
    <line x1="48" y1="74" x2="48" y2="102" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>
    <line x1="34" y1="88" x2="62" y2="88" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>
    <!-- Title -->
    <text x="72" y="84" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Campus Platforms</text>
    <text x="72" y="100" fill="#6E7681" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Next.js · TypeScript · Supabase</text>
    <!-- Metrics row -->
    <rect x="35" y="115" width="72" height="22" rx="4" fill="#064E3B" opacity="0.6"/>
    <text x="71" y="130" text-anchor="middle" fill="#10B981" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">4 Batches</text>
    <rect x="115" y="115" width="72" height="22" rx="4" fill="#064E3B" opacity="0.6"/>
    <text x="151" y="130" text-anchor="middle" fill="#10B981" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">11 Depts</text>
    <rect x="195" y="115" width="72" height="22" rx="4" fill="#064E3B" opacity="0.6"/>
    <text x="231" y="130" text-anchor="middle" fill="#10B981" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">10+ Utils</text>
    <rect x="275" y="115" width="72" height="22" rx="4" fill="#064E3B" opacity="0.6"/>
    <text x="311" y="130" text-anchor="middle" fill="#10B981" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">4 Exports</text>
    <!-- Project ref -->
    <text x="355" y="130" text-anchor="end" fill="#484f58" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Exam-Table</text>
  </g>

  <!-- Card 2: Streaming & Media -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 15" to="0 0" dur="0.5s" begin="0.6s" fill="freeze"/>
    <rect x="410" y="55" width="375" height="120" rx="10" fill="#0d1117"/>
    <rect x="410" y="55" width="375" height="120" rx="10" fill="url(#cardShine)"/>
    <rect x="410" y="55" width="375" height="120" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
    <!-- Left accent bar -->
    <rect x="410" y="55" width="4" height="120" rx="2" fill="#D4A017"/>
    <!-- Icon: play button -->
    <circle cx="443" cy="88" r="14" fill="#3D2E0A" opacity="0.5"/>
    <circle cx="443" cy="88" r="14" fill="none" stroke="#D4A017" stroke-width="1.2" opacity="0.6"/>
    <polygon points="438,81 438,95 452,88" fill="#D4A017" opacity="0.7"/>
    <!-- Title -->
    <text x="467" y="84" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Streaming &amp; Media</text>
    <text x="467" y="100" fill="#6E7681" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Next.js · MongoDB + Supabase</text>
    <!-- Metrics row -->
    <rect x="430" y="115" width="80" height="22" rx="4" fill="#3D2E0A" opacity="0.6"/>
    <text x="470" y="130" text-anchor="middle" fill="#D4A017" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">200+ Dramas</text>
    <rect x="518" y="115" width="72" height="22" rx="4" fill="#3D2E0A" opacity="0.6"/>
    <text x="554" y="130" text-anchor="middle" fill="#D4A017" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">7 Channels</text>
    <rect x="598" y="115" width="62" height="22" rx="4" fill="#3D2E0A" opacity="0.6"/>
    <text x="629" y="130" text-anchor="middle" fill="#D4A017" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">Live EPG</text>
    <rect x="668" y="115" width="62" height="22" rx="4" fill="#3D2E0A" opacity="0.6"/>
    <text x="699" y="130" text-anchor="middle" fill="#D4A017" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">RBAC</text>
    <!-- Project ref -->
    <text x="750" y="130" text-anchor="end" fill="#484f58" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Drama-Ghar</text>
  </g>

  <!-- Row 2 -->

  <!-- Card 3: Chrome & Web Tools -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 15" to="0 0" dur="0.5s" begin="0.9s" fill="freeze"/>
    <rect x="15" y="195" width="375" height="120" rx="10" fill="#0d1117"/>
    <rect x="15" y="195" width="375" height="120" rx="10" fill="url(#cardShine)"/>
    <rect x="15" y="195" width="375" height="120" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
    <!-- Left accent bar -->
    <rect x="15" y="195" width="4" height="120" rx="2" fill="#2563EB"/>
    <!-- Icon: puzzle/extension -->
    <circle cx="48" cy="228" r="14" fill="#1E3A5F" opacity="0.5"/>
    <circle cx="48" cy="228" r="14" fill="none" stroke="#2563EB" stroke-width="1.2" opacity="0.6"/>
    <rect x="40" y="222" width="12" height="9" rx="1.5" fill="none" stroke="#60A5FA" stroke-width="1.3" opacity="0.7"/>
    <rect x="44" y="219" width="4" height="4" rx="2" fill="#1E3A5F" stroke="#60A5FA" stroke-width="1" opacity="0.7"/>
    <!-- Title -->
    <text x="72" y="224" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Chrome &amp; Web Tools</text>
    <text x="72" y="240" fill="#6E7681" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Manifest V3 · Next.js · Classroom API</text>
    <!-- Metrics row -->
    <rect x="35" y="255" width="82" height="22" rx="4" fill="#1E3A5F" opacity="0.6"/>
    <text x="76" y="270" text-anchor="middle" fill="#60A5FA" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">20→1 Click</text>
    <rect x="125" y="255" width="90" height="22" rx="4" fill="#1E3A5F" opacity="0.6"/>
    <text x="170" y="270" text-anchor="middle" fill="#60A5FA" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">5-Step Pipeline</text>
    <rect x="223" y="255" width="72" height="22" rx="4" fill="#1E3A5F" opacity="0.6"/>
    <text x="259" y="270" text-anchor="middle" fill="#60A5FA" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">OAuth 2.0</text>
    <rect x="303" y="255" width="62" height="22" rx="4" fill="#1E3A5F" opacity="0.6"/>
    <text x="334" y="270" text-anchor="middle" fill="#60A5FA" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">ZIP DL</text>
    <!-- Project ref -->
    <text x="355" y="270" text-anchor="end" fill="#484f58" font-family="Segoe UI, system-ui, sans-serif" font-size="9">gcr-fetch · gcr-contacts</text>
  </g>

  <!-- Card 4: Agentic AI Systems -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 15" to="0 0" dur="0.5s" begin="1.1s" fill="freeze"/>
    <rect x="410" y="195" width="375" height="120" rx="10" fill="#0d1117"/>
    <rect x="410" y="195" width="375" height="120" rx="10" fill="url(#cardShine)"/>
    <rect x="410" y="195" width="375" height="120" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
    <!-- Left accent bar -->
    <rect x="410" y="195" width="4" height="120" rx="2" fill="#10B981"/>
    <!-- Icon: agent nodes -->
    <circle cx="443" cy="228" r="14" fill="#064E3B" opacity="0.5"/>
    <circle cx="443" cy="228" r="14" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.6"/>
    <circle cx="443" cy="224" r="4" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.8"/>
    <circle cx="437" cy="234" r="3" fill="none" stroke="#10B981" stroke-width="1" opacity="0.6"/>
    <circle cx="449" cy="234" r="3" fill="none" stroke="#10B981" stroke-width="1" opacity="0.6"/>
    <line x1="441" y1="227" x2="439" y2="232" stroke="#10B981" stroke-width="0.8" opacity="0.5"/>
    <line x1="445" y1="227" x2="447" y2="232" stroke="#10B981" stroke-width="0.8" opacity="0.5"/>
    <!-- Title -->
    <text x="467" y="224" fill="#ECFDF5" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">Agentic AI Systems</text>
    <text x="467" y="240" fill="#6E7681" font-family="Segoe UI, system-ui, sans-serif" font-size="11">React · Multi-Agent Pipeline · NLP</text>
    <!-- Metrics row -->
    <rect x="430" y="255" width="72" height="22" rx="4" fill="#064E3B" opacity="0.6"/>
    <text x="466" y="270" text-anchor="middle" fill="#10B981" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">5 Agents</text>
    <rect x="510" y="255" width="86" height="22" rx="4" fill="#064E3B" opacity="0.6"/>
    <text x="553" y="270" text-anchor="middle" fill="#10B981" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">3 Languages</text>
    <rect x="604" y="255" width="82" height="22" rx="4" fill="#064E3B" opacity="0.6"/>
    <text x="645" y="270" text-anchor="middle" fill="#10B981" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">Dyn. Pricing</text>
    <rect x="694" y="255" width="62" height="22" rx="4" fill="#064E3B" opacity="0.6"/>
    <text x="725" y="270" text-anchor="middle" fill="#10B981" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">APK</text>
    <!-- Project ref -->
    <text x="750" y="270" text-anchor="end" fill="#484f58" font-family="Segoe UI, system-ui, sans-serif" font-size="9">hamara-rozgar</text>
  </g>
</svg>
